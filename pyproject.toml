[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "move-mouse"
version = "1.0.0"
description = "Simula actividad de usuario para prevenir bloqueo de sesión"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.8"
authors = [
    {name = "Move Mouse Linux", email = "contact@movemouse.co.uk"},
]
keywords = ["mouse", "activity", "screensaver", "lock", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]

dependencies = [
    "python-xlib>=0.33",
    "pydbus>=0.6.0",
]

[project.optional-dependencies]
wayland = ["ydotool"]

[project.scripts]
move-mouse = "move_mouse.main:main"

[project.urls]
Homepage = "https://github.com/sw3103/movemouse"
"Bug Tracker" = "https://github.com/sw3103/movemouse/issues"

[tool.setuptools.packages.find]
include = ["move_mouse*"]
