app-id: org.movemouse.MoveMouse
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: move-mouse

finish-args:
  # X11 display + shared memory for MIT-SHM
  - --socket=x11
  - --share=ipc
  - --device=dri
  # D-Bus: screensaver inhibit
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  # D-Bus: session lock/unlock (logind via system bus)
  - --system-talk-name=org.freedesktop.login1
  # D-Bus: UPower for battery detection
  - --system-talk-name=org.freedesktop.UPower
  # D-Bus: AppIndicator tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.ayatana.indicator.application
  # Settings persistence
  - --filesystem=~/.config/move-mouse-linux:create
  # Autostart entry
  - --filesystem=~/.config/autostart:create

modules:
  - name: python3-xlib
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation python_xlib-0.33-py2.py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/fc/b8/ff33610932e0ee81ae7f1269c890f697d56ff74b9f5b2ee5d9b7fa2c5355/python_xlib-0.33-py2.py3-none-any.whl
        sha256: c3534038d42e0df2f1392a1b30a15a4ff5fdc2b86cfa94f072bf11b10a164398

  - name: pydbus
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation pydbus-0.6.0-py2.py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/92/56/27148014c2f85ce70332f18612f921f682395c7d4e91ec103783be4fce00/pydbus-0.6.0-py2.py3-none-any.whl
        sha256: 66b80106352a718d80d6c681dc2a82588048e30b75aab933e4020eb0660bf85e

  - name: move-mouse
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 data/org.movemouse.MoveMouse.desktop
          /app/share/applications/org.movemouse.MoveMouse.desktop
      - install -Dm644 data/org.movemouse.MoveMouse.metainfo.xml
          /app/share/metainfo/org.movemouse.MoveMouse.metainfo.xml
      - for size in 16 24 32 48 64 128 256; do
          install -Dm644
            data/icons/hicolor/${size}x${size}/apps/org.movemouse.MoveMouse.png
            /app/share/icons/hicolor/${size}x${size}/apps/org.movemouse.MoveMouse.png;
        done
      - install -Dm644 data/icons/hicolor/scalable/apps/org.movemouse.MoveMouse.png
          /app/share/icons/hicolor/scalable/apps/org.movemouse.MoveMouse.png
    sources:
      - type: dir
        path: ..
